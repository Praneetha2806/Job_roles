name: Track Job Applications

on:
  schedule:
    # 23:55 America/Los_Angeles.
    # GitHub Actions cron is UTC only, so this covers PDT (UTC-7); during PST
    # (UTC-8, roughly Nov-Mar) it will run at ~22:55 PT instead. Adjust the
    # hour by 1 around DST changes if exact EOD timing matters to you, or
    # keep two schedule entries and let the no-op runs be harmless.
    - cron: "55 6 * * *"
  # Run it by hand from the Actions tab ("Run workflow"), optionally with:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional: scan emails from this date (YYYY-MM-DD). Leave blank to continue from the last run."
        required: false
        default: ""
      reset:
        description: "Optional: type RESET to delete all tracked applications and start fresh (e.g. after copying this repo)."
        required: false
        default: ""

permissions:
  contents: write

# One run at a time, so two runs never push to the data branch at once.
concurrency:
  group: track-applications
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # The tracker's data (CSV, summary, state) lives on the `data` branch,
      # so copies of `main` start empty. A new copy creates the branch here.
      - name: Check out the data branch
        run: |
          if git fetch --depth=1 origin data:data; then
            git worktree add tracker-data data
          else
            echo "No data branch yet; creating an empty one."
            git worktree add --detach tracker-data
            git -C tracker-data checkout --orphan data
            git -C tracker-data rm -rfq --ignore-unmatch .
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run application tracker
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          START_DATE: ${{ inputs.start_date }}
          RESET_DATA: ${{ inputs.reset }}
          # Optional: email a summary on days with updates.
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TRACKER_DATA_DIR: tracker-data
        run: python track_applications.py

      - name: Commit updated data to the data branch
        # Also after a failed run, to keep the progress it saved.
        if: success() || failure()
        working-directory: tracker-data
        run: |
          git config user.name "application-tracker-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Log applications for $(date -u +%Y-%m-%d)"
          git push origin data
